<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Bills - Admin</title>
<style>
body{font-family:Arial;background:#f4f6f9;padding:20px;}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;}
button{padding:5px 10px;border:none;border-radius:4px;cursor:pointer;margin:0 2px;}
.viewBtn{background:#007bff;color:#fff;}
.editBtn{background:#ffc107;color:#000;}
.deleteBtn{background:#dc3545;color:#fff;}
.gtn{
    background: #28a745;
    color:#fff;
    padding: 10px 16px;
    border:none;
    border-radius: 5px;
    font-size:14px;
    cursor:pointer;
    transition: 0.3s;
}
.gtn i{
    margin-right:6px;

}
.gtn:hover{
    background-color: #218838;

}

</style>
</head>
<body>
<button class="gtn" onclick="window.location.href='{{ url_for('admin_bp.generate_bill') }}'">
    <i class="fa fa-file-invoice"></i> Generate Bill
</button>
<div class="container">
<h2>All Bills</h2>
<table>
<thead>
<tr><th>Bill ID</th><th>Patient</th><th>Date</th><th>Grand Total</th><th>Actions</th></tr>
</thead>
<tbody>
{% for bill in bills %}
<tr>
<td>{{ bill[0] }}</td>
<td>{{ bill[1] }}</td>
<td>{{ bill[3] }}</td>
<td>{{ bill[6] }}</td>
<td>
<a href="/admin/view_bill/{{ bill[0] }}">View</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>

<script>
// Add click events to all buttons
document.querySelectorAll(".viewBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
        const billId = this.closest("tr").dataset.billId;
        // Redirect to view_bill.html with billId as query param
        window.location.href = `view_bill.html?bill_id=${billId}`;
    });
});

document.querySelectorAll(".editBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
        const billId = this.closest("tr").dataset.billId;
        // Redirect to edit_bill.html with billId as query param
        window.location.href = `edit_bill.html?bill_id=${billId}`;
    });
});

document.querySelectorAll(".deleteBtn").forEach(btn=>{
    btn.addEventListener("click", function(){
        if(confirm("Are you sure you want to delete this bill?")){
            this.closest("tr").remove();
            alert("Bill deleted successfully!");
        }
    });
});
</script>
</body>
</html>
