<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{
  margin:0;
  font-family:Arial;
  display:flex;
}


.header{
  background:#007bff;
  color:#fff;
  padding:5px;
}

.header h2{
  margin:0;
}

.container{
  padding:20px;
}

/* Info Cards */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  position:relative;
}

.card i{
  font-size:32px;
  color:#007bff;
}

.card h3{
  margin:10px 0 5px;
}

.card span{
  font-size:24px;
  font-weight:bold;
}

/* Table */
.table-box{
  background:#fff;
  padding:20px;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
}

table th, table td{
  padding:10px;
  text-align:left;
  border-bottom:1px solid #ddd;
}

table th{
  background:#007bff;
  color:white;
}



.sidebar{
  width:220px;
  background:#343a40;
  min-height:100vh;
  padding-top:20px;
}
.sidebar a{
  display:block;
  color:white;
  padding:12px 20px;
  text-decoration:none;
}
.sidebar a:hover{
  background:#007bff;
}
.main{
  flex:1;
  background:#f4f6f9;
}
iframe{
  width:100%;
  height:100vh;
  border:none;
}
</style>
</head>

<body>
  
  

<!-- Sidebar -->
<div class="sidebar">
  <a href="{{ url_for('admin_bp.admin_dashboard')}}" >
    <i class="fa fa-home"></i> Dashboard
  </a>
  <a href="{{url_for('admin_bp.manage_book')}}" >
    <i class="fa fa-user-doctor"></i> manage appoinment
  </a>

  <a href="{{url_for('admin_bp.doctor_list')}}" >
    <i class="fa fa-user-doctor"></i> Doctor 
  </a>
  <a href="{{url_for('admin_bp.bill_list')}}" >
    <i class="fa fa-file-alt"></i> bill
  </a>

  <a href="{{url_for('admin_bp.appointment_details')}}" >
    <i class="fa fa-file-alt"></i> appoinment
  </a>


  <a href="{{url_for('admin_bp.department_list')}}" >
    <i class="fa fa-file-alt"></i> department
  </a>
  <a href="{{url_for('admin_bp.patient_list')}}" >
    <i class="fa fa-file-alt"></i> patient
  </a>

</div>

<!-- Main Content -->
<div class="main">
  <!--header-->
  <!-- Header -->
<div class="header">
  <h2>Welcome Admin 👋</h2>
  <p>Hospital Management System Dashboard</p>
</div>

<div class="container">

  <!-- Info Cards -->
  <div class="cards">
    <div class="card">
      <i class="fa fa-user-doctor"></i>
      <h3>Total Doctors</h3>
      <span id="doctorCount">0</span>
    </div>

    <div class="card">
      <i class="fa fa-calendar-check"></i>
      <h3>Today Appointments</h3>
      <span id="appointmentCount">0</span>
    </div>

    <div class="card">
      <i class="fa fa-users"></i>
      <h3>Total Patients</h3>
      <span id="patientCount">0</span>
    </div>

    <div class="card">
      <i class="fa fa-file-invoice"></i>
      <h3>Total Bills</h3>
      <span id="billCount">0</span>
    </div>
  </div>

 
  <iframe id="contentFrame" src="dashboard_home.html"></iframe>

  
</div>


  <!--header ended-->

</div>



<script>
function loadPage(page){
  document.getElementById("contentFrame").src = page;
}


/* Set Counts */
document.getElementById("doctorCount").innerText = dashboardData.doctors;
document.getElementById("appointmentCount").innerText = dashboardData.appointments;
document.getElementById("patientCount").innerText = dashboardData.patients;
document.getElementById("billCount").innerText = dashboardData.bills;

/* Fill Table */
const table = document.getElementById("appointmentTable");
dashboardData.recentAppointments.forEach(a=>{
  table.innerHTML += `
    <tr>
      <td>${a.patient}</td>
      <td>${a.doctor}</td>
      <td>${a.date}</td>
      <td>${a.status}</td>
    </tr>
  `;
});

</script>

</body>
</html>
