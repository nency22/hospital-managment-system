<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<title>login</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: url("{{ url_for('static', filename='images/h2.png') }}");
    background-size: cover;        /* full screen */
    background-position: center;   /* center */
    background-repeat: no-repeat;  /* repeat nahi */
        
}

/* container */
.container{
    animation:fadeIn 1.2s ease;
    width:350px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    background:rgba(0, 0, 0, 0.2);
}

/* login form */
.login{
    background-color: rgb(135, 140, 175);
    padding:30px;
    border-radius: 15px;
    animation:slideUp 1s ease;
}

/* heading */
.login h2{
    text-align:center;
    margin-bottom:20px;
    color: rgb(19, 19, 219);
    text-shadow: 2px 2px 5px rgb(5, 0, 19);
}

/* input box */
.input-box{
    margin-bottom:15px;
}

.input-box label{
    display:block;
    font-size:14px;
    color:#101010;
    margin-bottom:5px;
}

.input-box input{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

/* button */
button{
    width:100%;
    padding:12px;
    border:none;
    background:linear-gradient(to right,#667eea,#764ba2);
    color:#fff;
    font-size:16px;
    border-radius:25px;
    cursor:pointer;
    transition:0.4s;
}

button:hover{
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* animation */
@keyframes slideUp{
    from{
        transform:translateY(50px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
}
</style>

</head>
<body>

<div class="container">
    <form class="login" method="post">
        <h2>Login</h2>

        <div class="input-box">
            <label>username</label>
            <input type="text" name="username" required>
        </div>

        <div class="input-box">
            <label>PASSWORD</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit">Login</button>
        <a href="forgate_password.html">forgate password</a>

    </form>
</div>
</body>
</html>
