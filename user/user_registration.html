
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<title>registration</title>
<style>
    *{
        margin: 0;
        padding: 0px;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        margin:0;
        padding:0;
        /* background image */
        background-image: url("{{ url_for('static', filename='images/h2.png') }}");
           background-size: cover;        /* full screen */
        background-position: center;   /* center */
        background-repeat: no-repeat;  /* repeat nahi */
        

}
    /*form-container*/
    .container{
        animation:fadeIn 1.2s ease;
        width:350px;
        
        border-radius:12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        background:rgba(0, 0, 0, 0.2);
        margin:0;
        padding:25px;
        height:auto;
        
    }
    

        .registration{
        width:380px;
        background:#fff;
        padding:30px;
        background-color: rgb(135, 140, 175);
        
        border-radius: 15px;
        box-shadow:0 15px, 30px rgba(red, green, blue, alpha);
        animation:slideUP 1s ease;


    }

    /*headind*/
    .registration h1 {
        text-align:center;
        margin-bottom:20px;
        color:rgb(32, 32, 208);
        text-shadow:2px 2px 5px rgb(1, 0, 8);
    }

    /* input box*/
    .input-box{
        position:none;
        margin-bottom:10px;

    }
    .input-box input,
    .input-box textarea{
        width: 100%;
        padding:5px;
        border: 1px solid #ccc;
        outline:invert;
        border-radius:1px;
        font-size:14px;
        box-sizing: border-box;
        
    }
    .input-box textarea{
        resize:horizontal;
        height: 40px;
    }
    /*floating label*/
    .input-box label{
        position:initial;
        top:50%;
        left:10px;
        color:#101010;
        font-size:14px;
        transform: translateY(-50%);
        pointer-events:visible;
        transition: 0.3s;


    }
    .input-box select{
        width:100px;
        padding:10px;
        border:1px solid #ccc;
        outline:none;
        border-radius:6px;
        font-size:14px;
        background:transparent;
        appearance:none;
        cursor:pointer;
        
    }

    .input-box input:focus ~ label,
    .input-box input:valid ~ label,
    .input-box textarea:focus ~ label,
    .input-box textarea:valid ~ label
    .input-box  select:focus ~label
    .input-box select:valid ~ label
    {
        top: -8px;
        font-size: 12px;
        background: #fff;
        padding:0 5px;
        color:#6c63ff;
    }
        /*gender*/
    .gender{
        display: flex;
        justify-content: space-around;
        margin-bottom: 20px;
    }

    /*checkbox text*/
    .terms-check{
        display: flex;
        align-items: center;
        font-size: 13px;
        margin-top: 8px;
        color:#333;
    }
    .terms-check input{
        margin-right: 8px;
        cursor:pointer;
    }


    /* button*/
    button{
        width: 100px;
        padding: 12px;
        border: none;
        background:linear-gradient(to right,#667eea,#764ba2);
        color:#fff;
        font-size: 16px;
        border-radius: 25px;
        cursor: pointer;
        transition: 0.4s;

    }
    button:hover{
        transform: scale(1.05);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);

    }
    /*animation*/
    @keyframes slideUp{
        form{
            transform:translateY(50px);
            opacity: 0;
            
        }
        to{
            transform: translateY(50px);
            opacity: 1;
            
        }
    }

    @keyframes fadeIn{
        from{
            opacity: 0;
            
        
        }
        to{
            opacity: 1;
            
            
        }
    }

</style>
</head>
<body>
<div class="container">
    
<form action="" method="POST" class="registration">
    <h1>registration</h1>
 <div class="input-box">
    <label for="">username</label>
    <input type="text" name="username" required>
</div>
<div class="input-box">
    <label for="">EMAIL</label>
    <input type="email" name="email" required>
</div>
<div class="input-box">
    <label for="">MOBILE NUMBER</label>
    <input type="tel" name="mobile" required>
</div>
<div class="input-box">
    <label for="">PASSWORD</label>
    <input type="password" name="password" required>
</div>
<div class="input-box">
    <label for="">PASSWORD(confirm)</label>
    <input type="password" name="confirm_password" required>
</div>
<div class="gender">
    <label for="">GENDER</label>
    <input type="radio" name="gender"  value="male">MALE
     <input type="radio" name="gender"  value="female">FEMALE
</div>
<div class="input-box">

    <label for="">DATE OF BIRTH</label>
    <input type="date" name="dob" required>
</div>
<div class="input-box">
    <label for="">ADDRESS</label>
    <textarea name="address" id=""></textarea>
</div>
<div class="input-box">
    <select name="role" required>
        <option value=""  disabled selected></option>
        <option>admin</option>
        <option>doctor</option>
        <option>patient</option>
        </select> 
    <label>select role</label>
</div>   
<div class=" terms-check">   
    <label class="terms-check">
        <input type="checkbox">i agree to the term and condition
    </label>
    
</div><br>
<button type="submit">registration</button>
</form>
</div>
</body>
</html>
