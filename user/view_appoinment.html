<!DOCTYPE html>
<html>
<head>
<title>Appointment Details</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.container{
width:600px;
margin:auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:25px;
}

.detail{
margin:10px 0;
font-size:16px;
}

.label{
font-weight:bold;
color:#333;
}

.status{
padding:5px 10px;
border-radius:5px;
color:white;
}

.pending{
background:orange;
}

.approved{
background:green;
}

.rejected{
background:red;
}

.completed{
background:blue;
}

.back-btn{
margin-top:20px;
padding:10px 20px;
background:#2c3e50;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Appointment Details</h2>

<div class="detail">
<span class="label">Patient Name:</span> Rahul Patel
</div>

<div class="detail">
<span class="label">Doctor:</span> Dr. Patel
</div>

<div class="detail">
<span class="label">Department:</span> Cardiology
</div>

<div class="detail">
<span class="label">Appointment Date:</span> 12-01-2026
</div>

<div class="detail">
<span class="label">Time Slot:</span> 10:30 AM
</div>

<div class="detail">
<span class="label">Problem / Symptoms:</span> Chest Pain
</div>

<div class="detail">
<span class="label">Visit Type:</span> First Visit
</div>

<div class="detail">
<span class="label">Payment:</span> Online
</div>

<div class="detail">
<span class="label">Status:</span> 
<span class="status pending">Pending</span>
</div>

<button class="back-btn">Back</button>

</div>

</body>
</html>
