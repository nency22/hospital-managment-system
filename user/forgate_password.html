<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>forgate password</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            height:100vh;
            background:linear-gradient(135deg,#74ebd5,#9face6);
            display:flex;
            justify-content: center;
            align-items: center;

        background-image: url("D:/hospital_managment_system/static/images/h2.png");
        background-size: cover;        /* full screen */
        background-position: center;   /* center */
        background-repeat: no-repeat;  /* repeat nahi */
       

        }
        .container{
            background: #fff;
            padding: 30px;
            width:350px;
            border-radius: 12px;
            text-align: center;
            animation:slideIN 1s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .container h2 {
            margin-bottom: 14px;
            color:#333;
            
        }
        .container p{
            font-size: 14px;
            color:#555;
            margin-bottom: 20px;
        }
        input{
            width:100%;
            padding: 12px;
            border:none;
            border-radius: 8px;
            border:1px solid #ccc;
            outline:none;
        }
        button{
            width:100%;
            padding: 12px;
            border:none;
            border-radius: 8px;
            background: #6c63ff;
            color:#fff;
            font-size: 16px;
            cursor:pointer;
            transition: 0.3s;
        }
        button:hover{
            background-color: #554fe8;
            transform: scale(1.03);

        }

        #message{
            margin-top: 15px;
            font-size: 14px;
            color:green;
            animation: fadeIN 1s ease;
        }
        a{
            display:block;
            margin-top:15px;
            text-decoration: none;
            color:#6c63ff;
            font-size: 14px;
        }
        /*animation*/
        @keyframes slideIN{
            from{
                transform: translateY(-40px);
                opacity:0;

            }
            to{
                transform:translateY(0);
                opacity:1;
            }
        }

        @keyframes fadeIN{
            from{
                opacity:0;

            }
            to{
                opacity:1;
            }
        }
    </style>



</head>
<body>
    <div class="container">
        <h2>forgate password</h2>
        <p>please enter your registration email</p>
        <form onsubmit="sendLink(event)">
            <input type="email" id="email" placeholder="enter your email" required>
            <button type="submit">send reset link</button>

        </form>
        <p id="message"></p>
        <a href="user_login.html">back to login</a>

    </div>
    <script>
        function sendLink(event){
            event.preventDefault();
            let email=
            document.getElementById("email").value;
            let message=
            document.getElementById("message");
              if(email == ""){
                message.style.color ="red";
                message.innerText="please enter your email"
              }
              else{
                message.style.color="green";
                message.innerText="reset password link sent to"+email;
              }
        }
    </script>

</body>
</html>
