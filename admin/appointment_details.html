<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Appointment List</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:20px;
}
h2{
    text-align:center;
    margin-bottom:20px;
    color:#0c3da8;
}
table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
th, td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}
th{
    background:#0d6efd;
    color:#fff;
}
.status{
    font-weight:bold;
    padding:5px 10px;
    border-radius:5px;
    color:white;
}
.pending{background:orange;}
.approved{background:green;}
.rejected{background:red;}
button{
    padding:5px 10px;
    margin:2px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}
.approve-btn{background:green;}
.reject-btn{background:red;}
.delete-btn{background:#6c757d;}
button:hover{opacity:0.8;}
</style>
</head>
<body>

<h2>Admin Appointment List</h2>

<table id="appointmentTable">
<thead>
<tr>
    <th>ID</th>
    <th>Patient</th>
    <th>Doctor</th>
    <th>Department</th>
    <th>Date</th>
    <th>Time</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>
<tbody id="appointmentBody">
<!-- rows will be added by JS -->
</tbody>
</table>

<p id="emptyMessage" style="text-align:center; padding:15px; display:none;">No appointments found.</p>

<script>
// Example appointments data (In real project, fetch from backend)
let appointments = [
    {id:1, patient:"Rahul Patel", doctor:"Dr. Mehta", department:"Cardiology", date:"2026-01-30", time:"10:30 AM", status:"Pending"},
    {id:2, patient:"Nisha Shah", doctor:"Dr. Joshi", department:"Dental", date:"2026-01-31", time:"12:00 PM", status:"Approved"},
    {id:3, patient:"Amit Singh", doctor:"Dr. Shah", department:"Ortho", date:"2026-02-02", time:"03:00 PM", status:"Rejected"}
];

// Load appointments into table
function loadAppointments(){
    const tbody = document.getElementById("appointmentBody");
    const emptyMsg = document.getElementById("emptyMessage");
    tbody.innerHTML = "";

    if(appointments.length===0){
        emptyMsg.style.display="block";
        return;
    } else {
        emptyMsg.style.display="none";
    }

    appointments.forEach(app=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${app.id}</td>
            <td>${app.patient}</td>
            <td>${app.doctor}</td>
            <td>${app.department}</td>
            <td>${app.date}</td>
            <td>${app.time}</td>
            <td><span class="status ${app.status.toLowerCase()}">${app.status}</span></td>
            <td>
                <button class="approve-btn" onclick="approve(${app.id})">Approve</button>
                <button class="reject-btn" onclick="reject(${app.id})">Reject</button>
                <button class="delete-btn" onclick="deleteAppointment(${app.id})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Approve appointment
function approve(id){
    const app = appointments.find(a=>a.id===id);
    if(app){
        app.status="Approved";
        loadAppointments();
    }
}

// Reject appointment
function reject(id){
    const app = appointments.find(a=>a.id===id);
    if(app){
        app.status="Rejected";
        loadAppointments();
    }
}

// Delete appointment
function deleteAppointment(id){
    if(confirm("Are you sure you want to delete this appointment?")){
        appointments = appointments.filter(a=>a.id!==id);
        loadAppointments();
    }
}

// Initial load
window.onload = loadAppointments;
</script>

</body>
</html>
