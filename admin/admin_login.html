<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#4e54c8,#8f94fb);
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .login-box{
            width:350px;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-group{
            margin-bottom:15px;
        }

        .input-group label{
            font-weight:bold;
            display:block;
            margin-bottom:5px;
        }

        .input-group input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
        }

        .input-group input:focus{
            border-color:#4e54c8;
        }

        .login-btn{
            width:100%;
            padding:12px;
            background:#4e54c8;
            color:#fff;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        .login-btn:hover{
            background:#3b40a4;
        }

        .error{
            color:red;
            margin-top:10px;
            text-align:center;
        }

        .icon{
            text-align:center;
            font-size:50px;
            color:#4e54c8;
            margin-bottom:10px;
        }
    </style>
</head>
<body>

<div class="login-box">

    <form method="POST" action="{{ url_for('admin_bp.login') }}">

        <div class="icon">
            <i class="fas fa-user-shield"></i>
        </div>

        <h2>Admin Login</h2>

        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter admin username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>

    </form>

</div>

</body>
</html>
