    body{

    .box{
      background:#444447;

      border-radius:8px;
      max-width:900px;
      margin:auto;

    h2{margin-bottom:15px}

    input, textarea, select{
      width:100%;
      padding:8px;
      margin:6px 0 12px;
    }

    button{
      padding:10px 15px;
      border:none;
      cursor:pointer;
      border-radius:5px;
    }
    .btn-add{background:#28a745;color:#fff}
    .btn-reset{background:#6c757d;color:#fff}

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }
    table,th,td{border:1px solid #ccc}
    th,td{
      padding:8px;
      text-align:center;
    }
    img{
      width:100px;
      height:100px;
      object-fit:cover;
    }
    .action i{
      margin:0 6px;
      cursor:pointer;
    }
    .action a{
      color:#000;
      margin:0 8px;
      text-decoration: none;
    }
    .action a:hover{
      color:#007bff;
    }
  </style>

<body>

<div class="box">
  <h2>Add New Department</h2>

  <form id="deptForm" method="POST" enctype="multipart/form-data" action="{{url_for('admin_bp.add_department_route')}}">
    <input type="text" id="deptName" placeholder="Department Name" required name="name">

    <input type="text" id="deptDoctor" placeholder="Head Doctor" required name="doctor">

    <textarea id="deptDesc" placeholder="Description" name="description"></textarea>

    <input type="file" id="deptImage" accept="image/*" name="image">

    <select id="deptStatus" name="status">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>

    <button class="btn-add" type="submit">Add Department</button>
    <button class="btn-reset" type="reset">Reset</button>
  </form>
