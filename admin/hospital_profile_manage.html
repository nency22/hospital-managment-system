<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin | Hospital Profile Manage</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f4f6f9;padding:20px}
h1{margin-bottom:20px}
h2{margin-bottom:10px}
.card{
  background:#fff;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 4px 10px rgba(0,0,0,.1)
}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
input,textarea{
  width:100%;
  padding:8px;
  margin:6px 0
}
button{
  padding:8px 12px;
  border:none;
  border-radius:5px;
  background:#1565c0;
  color:white;
  cursor:pointer
}
button:hover{opacity:.9}
.delete{background:#d32f2f}
.box{
  border:1px solid #ddd;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px
}
</style>
</head>

<body>

<h1><i class="fa-solid fa-hospital"></i> Admin – Hospital Profile Manage</h1>

<!-- ================= BASIC INFO ================= -->
<div class="card">
  <h2>Hospital Basic Information</h2>
  <input type="text" placeholder="Hospital Name" value="Krishna Hospital">
  <input type="text" placeholder="Tagline" value="Multispecialist Hospital | Since 2010">
  <button onclick="save()">Save</button>
</div>

<!-- ================= CONTACT ================= -->
<div class="card">
  <h2>Contact & Location</h2>
  <input type="text" placeholder="Address" value="Ahmedabad, Gujarat">
  <input type="text" placeholder="Phone" value="+91 223344">
  <input type="email" placeholder="Email" value="hospital@gmail.com">
  <input type="text" placeholder="Website" value="www.krishnahospital.com">
  <button onclick="save()">Save</button>
</div>

<!-- ================= ABOUT ================= -->
<div class="card">
  <h2>About Hospital</h2>
  <textarea rows="4">Providing high-quality healthcare with experienced doctors.</textarea>
  <button onclick="save()">Update</button>
</div>

<!-- ================= DEPARTMENTS ================= -->
<div class="card">
  <div class="section-title">
    <h2>Departments</h2>
    <button onclick="addDepartment()">Add Department</button>
  </div>
  <div id="deptList">
    <div class="box">
      <input type="text" value="Cardiology">
      <button class="delete" onclick="remove(this)">Delete</button>
    </div>
  </div>
</div>

<!-- ================= DOCTORS ================= -->
<div class="card">
  <div class="section-title">
    <h2>Doctors</h2>
    <button onclick="addDoctor()">Add Doctor</button>
  </div>
  <div id="doctorList">
    <div class="box">
      <input type="text" value="Dr. A. Patel" placeholder="Doctor Name">
      <input type="text" value="Cardiology" placeholder="Specialization">
      <input type="text" value="10 Years" placeholder="Experience">
      <textarea placeholder="About Doctor">Heart Specialist</textarea>
      <button onclick="save()">Update</button>
      <button class="delete" onclick="remove(this)">Delete</button>
    </div>
  </div>
</div>

<!-- ================= FACILITIES ================= -->
<div class="card">
  <div class="section-title">
    <h2>Facilities & Services</h2>
    <button onclick="addFacility()">Add Facility</button>
  </div>
  <div id="facilityList">
    <div class="box">
      <input type="text" value="24x7 Emergency">
      <button class="delete" onclick="remove(this)">Delete</button>
    </div>
  </div>
</div>

<!-- ================= WORKING HOURS ================= -->
<div class="card">
  <div class="section-title">
    <h2>Working Hours</h2>
    <button onclick="addHour()">Add</button>
  </div>
  <div id="hourList">
    <div class="box">
      <input type="text" value="OPD: 9AM - 8PM">
      <button class="delete" onclick="remove(this)">Delete</button>
    </div>
  </div>
</div>

<!-- ================= ACHIEVEMENTS ================= -->
<div class="card">
  <div class="section-title">
    <h2>Achievements</h2>
    <button onclick="addAchievement()">Add Achievement</button>
  </div>
  <div id="achList">
    <div class="box">
      <input type="text" value="15 Years of Service">
      <button class="delete" onclick="remove(this)">Delete</button>
    </div>
  </div>
</div>

<script>
function addDepartment(){
  document.getElementById("deptList").appendChild(createBox("Department Name"));
}
function addDoctor(){
  let div=document.createElement("div");
  div.className="box";
  div.innerHTML=`
    <input placeholder="Doctor Name">
    <input placeholder="Specialization">
    <input placeholder="Experience">
    <textarea placeholder="About Doctor"></textarea>
    <button onclick="save()">Save</button>
    <button class="delete" onclick="remove(this)">Delete</button>
  `;
  doctorList.appendChild(div);
}
function addFacility(){
  facilityList.appendChild(createBox("Facility Name"));
}
function addHour(){
  hourList.appendChild(createBox("Working Hour"));
}
function addAchievement(){
  achList.appendChild(createBox("Achievement"));
}
function createBox(ph){
  let div=document.createElement("div");
  div.className="box";
  div.innerHTML=`
    <input placeholder="${ph}">
    <button class="delete" onclick="remove(this)">Delete</button>
  `;
  return div;
}
function remove(btn){
  btn.parentElement.remove();
}
function save(){
  alert("Data saved (Admin demo)");
}
</script>

</body>
</html>
